[package]
name = "inputlock"
version = "0.1.1"
edition = "2021"
description = "Lock keyboard and pointer on sway while the screen keeps updating; unlock with your password (PAM)"
license = "MIT"
readme = "README.md"
keywords = ["wayland", "sway", "lock", "layer-shell"]
categories = ["command-line-utilities"]

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
calloop = { version = "0.14", features = ["signals"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
