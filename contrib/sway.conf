# --- inputlock -------------------------------------------------------------
# While locked, sway is switched into this mode so none of your normal
# keybindings fire. Sway silently ignores modes with no bindings, so keep
# this one do-nothing binding in it.
mode "inputlock" {
    bindsym --release XF86Launch9 nop
}

# Lock input (screen keeps running):
bindsym $mod+Shift+x exec inputlock

# Optional: lock input automatically after 10 min idle, without blanking.
# exec swayidle -w timeout 600 'inputlock --dim 0.3'
